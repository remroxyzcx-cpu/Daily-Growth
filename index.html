<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日成长">
<title>每日成长</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#202536;--muted:#858b9b;--line:#eceef3;--accent:#6676d9;--accent2:#8b97ed;--green:#269b70;--soft:#eef0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700}.brand{font-size:27px;font-weight:800;letter-spacing:-1px;margin-top:5px}.date{font-size:13px;color:var(--muted);margin-top:7px}.avatar{width:45px;height:45px;border-radius:16px;background:#e9ebff;display:grid;place-items:center;font-size:22px}
.hero{background:linear-gradient(135deg,#6676d9,#8994e8);color:white;border-radius:25px;padding:22px;box-shadow:0 12px 28px #6676d926;margin-bottom:20px}.hero small{opacity:.82;font-size:12px}.hero h2{font-size:21px;margin:9px 0 18px}.progressrow{display:flex;align-items:end;justify-content:space-between}.percent{font-size:36px;font-weight:800;letter-spacing:-1px}.progressbar{height:8px;border-radius:20px;background:#ffffff48;overflow:hidden;margin-top:12px}.progressfill{height:100%;width:0;background:white;border-radius:20px;transition:width .25s}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 12px}.sectionhead h3{font-size:16px;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}
.tasks{display:grid;gap:10px}.task{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px 14px;transition:.2s}.task.done{border-color:#d7eee4;background:#fbfffd}.check{width:25px;height:25px;border:1.8px solid #cdd1dc;border-radius:9px;flex:none;display:grid;place-items:center;color:white;font-weight:800}.task.done .check{background:var(--green);border-color:var(--green)}.tasktext{flex:1;min-width:0}.taskname{font-size:14px;font-weight:700}.taskdesc{font-size:11px;color:var(--muted);margin-top:4px}.task.done .taskname{color:#7b8490;text-decoration:line-through}.emoji{font-size:19px;width:28px;text-align:center}
.note{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin-top:11px}.note label{font-size:13px;font-weight:700;display:block;margin-bottom:9px}.note textarea{width:100%;border:0;outline:0;resize:vertical;min-height:65px;font:14px/1.6 inherit;color:var(--ink);background:transparent}.note textarea::placeholder{color:#b0b4c0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:23px;display:block;margin-top:7px}.stat small{color:var(--muted);font-size:11px}
.actions{display:flex;gap:9px;margin-top:17px}.btn{border:0;border-radius:13px;padding:12px 14px;font-size:13px;font-weight:700;background:var(--soft);color:#5967c7;flex:1}.btn.secondary{background:#fff;color:#6f7584;border:1px solid var(--line)}
.history{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.historyrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.historyrow:last-child{border:0}.empty{font-size:12px;color:var(--muted);padding:7px 0}
footer{text-align:center;color:#a0a5b1;font-size:11px;margin-top:25px;line-height:1.8}
</style>
</head>
<body>
<main>
  <header class="top">
    <div><div class="eyebrow">DAILY GROWTH · 每日一点进步</div><div class="brand">每日成长</div><div class="date" id="today"></div></div>
    <div class="avatar">🌱</div>
  </header>
  <section class="hero">
    <small>今天也向前走了一点</small>
    <h2 id="greeting">慢慢来，持续比完美重要。</h2>
    <div class="progressrow"><div><small>今日完成进度</small><div class="percent" id="percent">0%</div></div><small id="count">0 / 6 项完成</small></div>
    <div class="progressbar"><div class="progressfill" id="bar"></div></div>
  </section>
  <div class="sectionhead"><h3>今天的计划</h3><span>完成一项，点亮一项</span></div>
  <section class="tasks" id="tasks"></section>
  <section class="note">
    <label for="reflection">✍️ 今天的一点记录</label>
    <textarea id="reflection" placeholder="今天有什么收获？遇到了什么困难？"></textarea>
  </section>
  <div class="sectionhead"><h3>成长统计</h3><span>记录自己的节奏</span></div>
  <section class="grid">
    <div class="stat"><small>近 7 天完成项目</small><b id="weekDone">0</b></div>
    <div class="stat"><small>近 7 天打卡天数</small><b id="weekDays">0</b></div>
  </section>
  <div class="sectionhead"><h3>最近记录</h3><span>自动保存</span></div>
  <section class="history" id="history"><div class="empty">完成今天的任务后，这里会留下记录。</div></section>
  <div class="actions">
    <button class="btn" id="export">导出打卡记录</button>
    <button class="btn secondary" id="reset">清空今天勾选</button>
  </div>
  <footer>不必每天满分，重要的是一直在自己的节奏里。<br>数据保存在当前浏览器中，请定期导出备份。</footer>
</main>
<script>
const tasks=[
 {id:"gym",emoji:"🏋️",name:"健身 / 活动",desc:"按计划训练，也可以安排恢复日"},
 {id:"vocab",emoji:"🔤",name:"英语：背单词",desc:"主动回忆，少量多次"},
 {id:"cet",emoji:"🎧",name:"英语六级专项",desc:"听力、阅读、写作或翻译，记得复盘"},
 {id:"read",emoji:"📖",name:"阅读",desc:"读几页也算，保持习惯"},
 {id:"ai",emoji:"💡",name:"AI 实践",desc:"动手做一个小尝试，不只看教程"},
 {id:"phone",emoji:"📵",name:"短视频管理",desc:"有意识地使用手机，给自己留出空闲"}
];
const $=id=>document.getElementById(id);
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const storeKey="dailyGrowthRecords_v1";
let records={};
try{records=JSON.parse(localStorage.getItem(storeKey)||"{}")||{}}catch(e){records={}}
const key=todayKey();
if(!records[key])records[key]={done:[],note:""};
function save(){localStorage.setItem(storeKey,JSON.stringify(records))}
function render(){
 const r=records[key];$("today").textContent=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
 $("tasks").innerHTML=tasks.map(t=>`<div class="task ${r.done.includes(t.id)?"done":""}" data-id="${t.id}"><div class="check">${r.done.includes(t.id)?"✓":""}</div><div class="emoji">${t.emoji}</div><div class="tasktext"><div class="taskname">${t.name}</div><div class="taskdesc">${t.desc}</div></div></div>`).join("");
 const n=r.done.length,p=Math.round(n/tasks.length*100);$("percent").textContent=p+"%";$("count").textContent=`${n} / ${tasks.length} 项完成`;$("bar").style.width=p+"%";
 $("greeting").textContent=p===100?"今天的计划全部完成，做得很好！":p>=50?"已经完成不少了，继续保持自己的节奏。":"慢慢开始就好，不需要一下子完成全部。";
 $("reflection").value=r.note||"";
 renderStats();
}
function renderStats(){
 const now=new Date();let total=0,days=0,rows=[];
 for(let i=0;i<7;i++){let d=new Date(now);d.setDate(now.getDate()-i);let k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;let r=records[k];if(r&&r.done.length){total+=r.done.length;days++}}
 $("weekDone").textContent=total;$("weekDays").textContent=days+" 天";
 Object.keys(records).sort().reverse().slice(0,7).forEach(k=>{let r=records[k];rows.push(`<div class="historyrow"><span>${k}</span><b>${r.done.length}/${tasks.length} 项 · ${Math.round(r.done.length/tasks.length*100)}%</b></div>`)});
 $("history").innerHTML=rows.length?rows.join(""):'<div class="empty">完成今天的任务后，这里会留下记录。</div>';
}
$("tasks").addEventListener("click",e=>{const el=e.target.closest(".task");if(!el)return;const id=el.dataset.id;const a=records[key].done;records[key].done=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();render()});
$("reflection").addEventListener("input",e=>{records[key].note=e.target.value;save()});
$("reset").addEventListener("click",()=>{if(confirm("确定清空今天的勾选吗？")){records[key].done=[];save();render()}});
$("export").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="每日成长打卡记录.json";a.click();URL.revokeObjectURL(url)});
render();
</script>
</body>
</html>
